<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>博士岗位雷达看板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <style>
      :root {
        --x-red: #d32f2f;
        --x-red-text: #ff6b66;
        --x-red-soft: rgb(229 57 53 / 0.16);
        --x-amber: #f5a623;
        --x-green: #3ecf8e;
        --x-bg: #0d0d0f;
        --x-card: #1a1a1d;
        --x-card-2: #232327;
      }
      html, body { background: var(--x-bg); }
      body { color: var(--text-primary); }
      .x-top {
        position: sticky; top: 0; z-index: 20;
        background: color-mix(in srgb, var(--x-bg) 88%, transparent);
        backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur);
        border-bottom: 1px solid var(--stroke-secondary);
        padding: 0;
      }
      .x-top__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: var(--page-max); margin: 0 auto; }
      .x-brand { font: var(--type-heading); margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .x-brand b { color: var(--x-red-text); font-weight: var(--weight-bold); }
      .x-updated { font: var(--type-caption); color: var(--text-secondary); }
      .x-seg { display: inline-flex; border: 1px solid var(--stroke-primary); border-radius: var(--r-pill); padding: 2px; }
      .x-seg button {
        min-height: var(--tap); min-width: var(--tap); padding: 0 14px; border: 0; border-radius: var(--r-pill);
        background: transparent; color: var(--text-secondary); font: var(--type-label); cursor: pointer;
      }
      .x-seg button[aria-pressed="true"] { background: var(--x-red); color: #fff; }
      .x-tabs { display: flex; gap: 4px; overflow-x: auto; max-width: var(--page-max); margin: 10px auto 0; scrollbar-width: none; }
      .x-tabs a {
        flex: none; display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 14px;
        font: var(--type-label); color: var(--text-secondary); text-decoration: none; border-bottom: 2px solid transparent;
      }
      .x-tabs a[aria-current="page"] { color: var(--text-primary); border-bottom-color: var(--x-red); }
      .x-wrap { padding: 8px 0 24px; display: grid; gap: 20px; min-width: 0; }
      .x-h2 { font: var(--type-heading); margin: 8px 0 0; }
      .x-sub { font: var(--type-small); color: var(--text-secondary); margin: 4px 0 0; }
      .x-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
      .x-kpi { background: var(--x-card); border: 1px solid var(--stroke-secondary); border-radius: var(--r-m); padding: 14px 16px; display: grid; gap: 4px; }
      .x-kpi__fig { font: var(--type-figure); font-variant-numeric: tabular-nums; }
      .x-kpi__fig.is-red { color: var(--x-red); }
      .x-kpi__label { font: var(--type-caption); color: var(--text-secondary); }
      .x-card { background: var(--x-card); border: 1px solid var(--stroke-secondary); border-radius: var(--r-m); padding: 16px; min-width: 0; }
      .x-card h3 { font: var(--type-body-strong); margin: 6px 0 0; }
      .x-card.is-accent { border-color: var(--x-red); background: linear-gradient(var(--x-red-soft), transparent 70%), var(--x-card); }
      .x-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
      .x-list { display: grid; gap: 10px; }
      .x-school { display: grid; gap: 2px; }
      .x-school__zh { font: var(--type-body-strong); }
      .x-school__en { font: var(--type-caption); color: var(--text-secondary); }
      .x-meta { font: var(--type-caption); color: var(--text-secondary); }
      .x-badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .x-badge {
        display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--r-pill);
        font: var(--type-tag); border: 1px solid currentColor; white-space: nowrap;
      }
      .x-badge--ok { color: var(--x-green); }
      .x-badge--warn { color: var(--x-amber); }
      .x-badge--red { color: #fff; background: var(--x-red); border-color: var(--x-red); }
      .x-badge--redline { color: #ff6b66; }
      .x-badge--muted { color: var(--text-secondary); }
      .x-badge--star { color: var(--x-amber); border-color: transparent; padding-inline: 0; }
      .x-row-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
      .x-title { font: var(--type-body-strong); margin: 10px 0 2px; }
      .x-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 16px; margin: 12px 0 0; }
      .x-kv > div { min-width: 0; }
      .x-kv dt { font: var(--type-caption); color: var(--text-secondary); margin: 0 0 2px; }
      .x-kv dd { font: var(--type-small); margin: 0; overflow-wrap: anywhere; }
      .x-dl { margin: 0; display: grid; gap: 4px; }
      .x-dl > div { display: grid; grid-template-columns: minmax(90px, max-content) minmax(0, 1fr); gap: 8px; }
      .x-dl dt { font: var(--type-caption); color: var(--text-secondary); margin: 0; overflow-wrap: anywhere; }
      .x-dl dd { margin: 0; font: var(--type-small); overflow-wrap: anywhere; }
      .x-ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font: var(--type-small); }
      .x-scores { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; margin-top: 12px; font: var(--type-caption); color: var(--text-secondary); }
      .x-scores b { color: var(--text-primary); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
      .x-bar { height: 6px; border-radius: var(--r-pill); background: var(--x-card-2); overflow: hidden; min-width: 60px; }
      .x-bar i { display: block; height: 100%; background: var(--x-red); border-radius: inherit; }
      .x-bar.is-dim i { background: var(--text-secondary); }
      .x-links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font: var(--type-small); }
      .x-links a, .x-a { color: var(--text-primary); text-decoration: underline; text-decoration-color: var(--x-red); text-underline-offset: 3px; overflow-wrap: anywhere; }
      .x-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .x-controls label { font: var(--type-caption); color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
      .x-select, .x-input {
        min-height: var(--tap); padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--stroke-primary);
        background: var(--x-card); color: var(--text-primary); font: var(--type-small);
      }
      .x-input { min-width: 0; flex: 1 1 220px; }
      .x-chipbtn {
        min-height: 36px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--stroke-primary);
        background: transparent; color: var(--text-secondary); font: var(--type-tag); cursor: pointer; position: relative;
      }
      .x-chipbtn::after { content: ""; position: absolute; inset: -4px 0; }
      .x-chipbtn[aria-pressed="true"] { background: var(--x-red); border-color: var(--x-red); color: #fff; }
      .x-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); font: var(--type-small); color: var(--text-primary); cursor: pointer; }
      .x-toggle input { accent-color: var(--x-red); width: 18px; height: 18px; }
      input[type="range"] { accent-color: var(--x-red); }
      .x-count { font: var(--type-caption); color: var(--text-secondary); }
      details.x-more { margin-top: 10px; }
      details.x-more > summary { cursor: pointer; font: var(--type-caption); color: var(--text-secondary); min-height: 32px; display: flex; align-items: center; }
      details.x-more > summary:hover { color: var(--text-primary); }
      .x-more__body { font: var(--type-small); color: var(--text-primary); display: grid; gap: 8px; padding-top: 4px; }
      details.x-section { background: var(--x-card); border: 1px solid var(--stroke-secondary); border-radius: var(--r-m); padding: 4px 16px; }
      details.x-section > summary { cursor: pointer; font: var(--type-body-strong); min-height: var(--tap); display: flex; align-items: center; gap: 8px; }
      details.x-section[open] { padding-bottom: 16px; }
      details.x-section .x-card { background: var(--x-card-2); }
      .x-hidden { color: var(--text-secondary); font-style: italic; }
      .x-muted { color: var(--text-secondary); }
      .x-dl-list { display: grid; gap: 8px; }
      .x-dl-list > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--stroke-secondary); }
      .x-dl-list > li:first-child { border-top: 0; }
      .x-plain { list-style: none; margin: 0; padding: 0; }
      .x-days { font: var(--type-label); color: var(--x-red-text); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .x-sup { cursor: pointer; transition: border-color var(--dur-quick) var(--ease-out); }
      .x-sup:hover, .x-sup:focus-visible { border-color: var(--x-red); outline: none; }
      .x-kw { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
      .x-kw span { font: var(--type-caption); color: var(--text-secondary); background: var(--x-card-2); border-radius: var(--r-pill); padding: 2px 8px; }
      .x-notice { border-left: 3px solid var(--x-red); }
      .x-notice li { padding: 10px 0; border-top: 1px solid var(--stroke-secondary); display: grid; gap: 4px; }
      .x-notice li:first-child { border-top: 0; }
      .x-notice b { font: var(--type-label); }
      .x-drawer { position: fixed; inset: 0; z-index: 50; display: none; }
      .x-drawer.is-open { display: block; }
      .x-drawer__scrim { position: absolute; inset: 0; background: rgb(0 0 0 / 0.6); }
      .x-drawer__panel {
        position: absolute; top: 0; right: 0; bottom: 0; width: min(760px, 100%); overflow-y: auto;
        background: var(--x-bg); border-left: 1px solid var(--stroke-primary); padding: 0 var(--gutter) 40px;
        overscroll-behavior: contain;
      }
      .x-drawer__bar { position: sticky; top: 0; background: var(--x-bg); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--stroke-secondary); z-index: 1; }
      .x-close { min-width: var(--tap); min-height: var(--tap); border-radius: var(--r-pill); border: 1px solid var(--stroke-primary); background: var(--x-card); color: var(--text-primary); font: var(--type-label); cursor: pointer; }
      .x-arg { display: grid; gap: 4px; padding: 14px 0; border-top: 1px solid var(--stroke-secondary); }
      .x-arg:first-of-type { border-top: 0; }
      .x-arg__k { font: var(--type-tag); color: var(--x-red-text); letter-spacing: 0.02em; }
      .x-arg__v { font: var(--type-small); overflow-wrap: anywhere; }
      .x-arg__v.is-claim { font: var(--type-body-strong); }
      .x-paper { padding: 8px 0; border-top: 1px solid var(--stroke-secondary); }
      .x-paper:first-child { border-top: 0; }
      .x-email { display: grid; gap: 10px; margin-top: 10px; }
      .x-email__row { display: grid; gap: 4px; }
      .x-email__head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .x-pre { white-space: pre-wrap; font: var(--type-small); line-height: 1.5; background: var(--x-card); border: 1px solid var(--stroke-secondary); border-radius: var(--r-s); padding: 12px; margin: 0; overflow-wrap: anywhere; }
      .x-copy { min-height: 36px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--x-red); background: transparent; color: var(--text-primary); font: var(--type-tag); cursor: pointer; position: relative; }
      .x-copy::after { content: ""; position: absolute; inset: -4px 0; }
      .x-copy.is-done { background: var(--x-red); color: #fff; }
      .x-foot { padding: 20px 0 8px; border-top: 1px solid var(--stroke-secondary); font: var(--type-caption); color: var(--text-secondary); }
      .x-empty { font: var(--type-small); color: var(--text-secondary); padding: 16px 0; }
      .x-linked { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--stroke-secondary); display: grid; gap: 8px; }
      .x-linked__row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .x-supchip {
        display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 6px 0 12px; border-radius: var(--r-pill);
        border: 1px solid var(--stroke-primary); background: var(--x-card-2); color: var(--text-primary); font: var(--type-tag); cursor: pointer; position: relative;
      }
      .x-supchip::after { content: ""; position: absolute; inset: -4px 0; }
      .x-supchip:hover, .x-supchip:focus-visible { border-color: var(--x-red); outline: none; }
      .x-supchip b { font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; color: var(--x-red-text); }
      .x-supchip .x-badge { padding: 0 6px; }
      .x-linked__toggle { justify-self: start; }
      .x-linked__body { display: grid; gap: 8px; }
      .x-linked__body:empty { display: none; }
      .x-supblock { background: var(--x-card-2); border: 1px solid var(--stroke-secondary); border-radius: var(--r-s); scroll-margin-top: 140px; }
      .x-supblock.is-open { border-color: var(--stroke-primary); }
      .x-supblock__head {
        width: 100%; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-height: var(--tap); padding: 8px 12px;
        background: transparent; border: 0; color: var(--text-primary); font: var(--type-small); text-align: left; cursor: pointer; border-radius: inherit;
      }
      .x-supblock__head:focus-visible { outline: 2px solid var(--x-red); outline-offset: -2px; }
      .x-supblock__name { font: var(--type-label); flex: 1 1 200px; min-width: 0; display: grid; gap: 2px; }
      .x-supblock__chev { color: var(--text-secondary); transition: transform var(--dur-quick) var(--ease-out); }
      .x-supblock.is-open .x-supblock__chev { transform: rotate(90deg); }
      .x-supblock__body { padding: 0 12px 14px; }
      .x-supblock__body:empty { display: none; }
      .x-supblock .x-pre { background: var(--x-card); }
      .x-phd { display: grid; gap: 10px; }
      .x-phd__sum { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: var(--type-small); }
      .x-phd__an { margin: 0; display: grid; gap: 8px; background: var(--x-card-2); border-radius: var(--r-s); padding: 12px; }
      .x-supblock .x-phd__an { background: var(--x-card); }
      .x-phd__an dt { font: var(--type-caption); color: var(--text-secondary); margin: 0; }
      .x-phd__an dd { font: var(--type-small); margin: 2px 0 0; overflow-wrap: anywhere; }
      .x-phd__group { display: grid; gap: 2px; }
      .x-phd__gh { font: var(--type-tag); color: var(--text-secondary); margin: 6px 0 0; }
      .x-phd__list > li { padding: 8px 0; border-top: 1px solid var(--stroke-secondary); display: grid; gap: 2px; min-width: 0; }
      .x-phd__list > li:first-child { border-top: 0; }
      .x-phd__name { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font: var(--type-label); }
      .x-phd__yr { font: var(--type-caption); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
      .x-phd__topic { font: var(--type-small); overflow-wrap: anywhere; }
      .x-phd__more { justify-self: start; margin-top: 4px; }
      .x-supchip .x-phdn, .x-phdn { font: var(--type-caption); color: var(--text-secondary); white-space: nowrap; }
      /* email draft language toggle */
      .x-edraft { display: grid; gap: 10px; }
      .x-edseg { justify-self: start; }
      .x-edseg button { min-height: 36px; position: relative; }
      .x-edseg button::after { content: ""; position: absolute; inset: -4px 0; }
      .x-pre a { color: var(--text-primary); text-decoration: underline; text-decoration-color: var(--x-red); text-underline-offset: 3px; overflow-wrap: anywhere; }
      /* competitiveness report */
      .x-comp { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
      .x-comp__docs { display: grid; gap: 20px; min-width: 0; }
      .x-toc {
        position: sticky; top: calc(var(--x-top-h, 110px) + 12px); max-height: calc(100vh - var(--x-top-h, 110px) - 24px); overflow-y: auto;
        background: var(--x-card); border: 1px solid var(--stroke-secondary); border-radius: var(--r-m); padding: 10px; display: grid; gap: 2px; z-index: 5;
      }
      .x-toc__g { font: var(--type-tag); color: var(--x-red-text); margin: 8px 10px 2px; }
      .x-toc__g:first-child { margin-top: 2px; }
      .x-toc a {
        display: flex; align-items: center; min-height: 40px; padding: 4px 10px; border-left: 2px solid transparent; border-radius: 0 var(--r-s) var(--r-s) 0;
        font: var(--type-small); color: var(--text-secondary); text-decoration: none;
      }
      .x-toc a:hover { color: var(--text-primary); background: var(--x-card-2); }
      .x-toc a.is-active { color: var(--text-primary); border-left-color: var(--x-red); background: var(--x-card-2); }
      .x-md-sec { scroll-margin-top: calc(var(--x-top-h, 110px) + 16px); }
      .x-md-sec > h2 { font: var(--type-title); margin: 0 0 4px; }
      .x-md { font: var(--type-body); line-height: 1.7; min-width: 0; overflow-wrap: anywhere; }
      .x-md h3 { font: var(--type-heading); margin: 8px 0 12px; }
      .x-md h4 { font: var(--type-heading); margin: 28px 0 10px; padding-left: 12px; border-left: 3px solid var(--x-red); scroll-margin-top: calc(var(--x-top-h, 110px) + 16px); }
      .x-md h5 { font: var(--type-body-strong); margin: 20px 0 8px; color: var(--x-red-text); }
      .x-md h6 { font: var(--type-label); margin: 16px 0 6px; color: var(--text-secondary); }
      .x-md p { margin: 0 0 12px; }
      .x-md ul, .x-md ol { margin: 0 0 12px; padding-left: 22px; }
      .x-md li { margin: 4px 0; }
      .x-md li > ul, .x-md li > ol { margin: 4px 0 0; }
      .x-md li::marker { color: var(--x-red-text); }
      .x-md strong { font-weight: var(--weight-bold); color: var(--text-primary); }
      .x-md hr { border: 0; border-top: 1px solid var(--stroke-secondary); margin: 20px 0; }
      .x-md code { font-family: "Geist Mono", ui-monospace, monospace; font-size: 0.9em; background: var(--x-card-2); border-radius: 6px; padding: 1px 6px; }
      .x-md-tw { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--stroke-secondary); border-radius: var(--r-s); -webkit-overflow-scrolling: touch; }
      .x-md table { border-collapse: collapse; width: 100%; min-width: 640px; font: var(--type-small); line-height: 1.55; }
      .x-md th, .x-md td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--stroke-secondary); min-width: 110px; overflow-wrap: normal; word-break: normal; }
      .x-md td a { overflow-wrap: anywhere; }
      .x-md thead th { background: var(--x-card-2); font-weight: var(--weight-medium); color: var(--text-secondary); white-space: nowrap; }
      .x-md tbody tr:last-child td { border-bottom: 0; }
      @media (max-width: 900px) {
        .x-comp { grid-template-columns: minmax(0, 1fr); gap: 12px; }
        .x-toc { display: flex; gap: 4px; max-height: none; overflow-x: auto; overflow-y: hidden; padding: 4px; border-radius: var(--r-s); top: var(--x-top-h, 110px); scrollbar-width: none; }
        .x-toc__g { display: none; }
        .x-toc a { flex: none; white-space: nowrap; min-height: var(--tap); border-left: 0; border-bottom: 2px solid transparent; border-radius: 0; }
        .x-toc a.is-active { border-bottom-color: var(--x-red); }
        .x-md h4, .x-md-sec { scroll-margin-top: calc(var(--x-top-h, 110px) + 70px); }
      }
      @media (max-width: 640px) {
        .x-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .x-kv { grid-template-columns: minmax(0, 1fr); }
        .x-select { flex: 1 1 140px; }
      }
    </style>
  </head>
  <body>
    <div class="page" id="top">
      <header class="x-top">
        <div class="x-top__row">
          <p class="x-brand"><b id="x-brand">博士岗位雷达看板</b><span class="x-updated" id="x-updated"></span></p>
          <div class="x-seg" role="group" aria-label="Language">
            <button type="button" data-lang="zh">中文</button>
            <button type="button" data-lang="en">EN</button>
          </div>
        </div>
        <nav class="x-tabs" id="x-tabs" aria-label="Tabs"></nav>
      </header>
      <main class="x-wrap" id="app"></main>
      <footer class="x-foot"><p id="x-foot"></p></footer>
    </div>
    <div class="x-drawer" id="x-drawer" aria-hidden="true">
      <div class="x-drawer__scrim" data-act="close"></div>
      <div class="x-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="x-drawer-title" id="x-drawer-panel"></div>
    </div>

    <!-- ===================== DATA (daily refresh replaces master.json / this block) ===================== -->
    <script src="data.js"></script>
    <script src="comp.js"></script>
    <script>
      /* DATA: the single source for everything on the page (data.js sets window.PHD_DATA). Render purely from it. */
      const DATA = window.PHD_DATA || {};
    </script>
    <!-- ================================================================================================= -->

    <script src="hark.js"></script>
    <script>
/* ---------- helpers ---------- */
var ZH = /[\u4e00-\u9fff]/;
/* known CSC terms translated before the Chinese check, so short labels survive in EN */

  var s = ((p.language_requirement || "") + " " + (p.language_when || "")).toLowerCase();
  if (/norwegian|scandinavian|dutch|swedish|danish|finnish|german (is )?required|thesis language|in french/.test(s)) return 0;
  if (/ielts|toefl|test score|certificate|cefr|\bb2\b|\bc1\b/.test(s) && !/no test|no specific test|no certificate/.test(s)) return 1;
  return 2;
}
function cscScore(p) {
  var s = (p.csc || "").toLowerCase();
  if (/^yes|separate csc|csc route exists/.test(s)) return 3;

  if (!s || /unclear|unknown/.test(s)) return 1;

/* ---------- competitiveness report: small markdown renderer ---------- */
function mdInline(s) {
  var ph = [];
  function keep(h) { ph.push(h); return "\u0000" + (ph.length - 1) + "\u0000"; }
  s = String(s).replace(/`([^`]+)`/g, function (m, c) { return keep("<code>" + esc(c) + "</code>"); });
  s = s.replace(/\[([^\]]+)\]\(([^\s)]+(?:\([^\s)]*\)[^\s)]*)*)\)/g, function (m, tx, u) {
    return keep('<a class="x-a" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(tx).replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>") + "</a>");
  });
  s = linkify(esc(s));
  s = s.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
  return s.replace(/\u0000(\d+)\u0000/g, function (m, i) { return ph[Number(i)]; });
}
function mdCells(row) {
  return row.trim().replace(/^\|/, "").replace(/\|\s*$/, "").split(/(?<!\\)\|/).map(function (c) { return c.trim().replace(/\\\|/g, "|"); });
}
function mdRender(md, pre, toc) {

  function flushP() { if (para.length) { out.push("<p>" + para.map(mdInline).join("<br>") + "</p>"); para = []; } }
  function closeLists(to) { while (stack.length > to) { out.push("</li></" + stack.pop().tag + ">"); } }
  var isSep = function (l) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l || ""); };
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i], m;
    if (!ln.trim()) { flushP(); continue; }
    if ((m = ln.match(/^(#{1,4})\s+(.*?)\s*#*\s*$/))) {
      flushP(); closeLists(0);
      var lv = m[1].length, id = pre + "-" + (++hn);
      if (lv === 2) toc.push({ id: id, text: m[2].replace(/\*\*/g, "") });
      out.push("<h" + (lv + 2) + ' id="' + id + '">' + mdInline(m[2]) + "</h" + (lv + 2) + ">");
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) { flushP(); closeLists(0); out.push("<hr>"); continue; }
    if (/^\s*\|/.test(ln) && isSep(lines[i + 1])) {
      flushP(); closeLists(0);
      var head = mdCells(ln), rows = [];
      i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(mdCells(lines[i])); i++; }
      i--;
      out.push('<div class="x-md-tw" tabindex="0"><table><thead><tr>' + head.map(function (c) { return '<th scope="col">' + mdInline(c) + "</th>"; }).join("") + "</tr></thead><tbody>"
        + rows.map(function (r) { return "<tr>" + head.map(function (_, j) { return "<td>" + mdInline(r[j] || "") + "</td>"; }).join("") + "</tr>"; }).join("")
        + "</tbody></table></div>");
      continue;
    }
    if ((m = ln.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
      flushP();
      var ind = m[1].replace(/\t/g, "    ").length, tag = /\d/.test(m[2]) ? "ol" : "ul";
      while (stack.length && ind < stack[stack.length - 1].indent) closeLists(stack.length - 1);
      var top = stack[stack.length - 1];
      if (top && ind === top.indent && top.tag !== tag) { closeLists(stack.length - 1); top = stack[stack.length - 1]; }
      if (top && ind === top.indent) out.push("</li><li>");
      else {
        var start = tag === "ol" && parseInt(m[2], 10) !== 1 ? ' start="' + parseInt(m[2], 10) + '"' : "";
        out.push("<" + tag + start + "><li>");
        stack.push({ indent: ind, tag: tag });
      }
      out.push(mdInline(m[3]));
      continue;
    }
    if (stack.length && /^\s+\S/.test(ln)) { out.push("<br>" + mdInline(ln.trim())); continue; }
    closeLists(0);
    para.push(ln.trim());
  }
  flushP(); closeLists(0);
  return out.join("");
}

function copyText(text, btn) {

  ta.value = text;

  ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "-9999px"; ta.style.opacity = "0";
  (btn.closest(".x-drawer__panel") || document.body).appendChild(ta);
  ta.focus(); ta.select();
  try { ta.setSelectionRange(0, text.length); } catch (e) {}
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();

    btn.textContent = success ? L("已复制", "Copied") : L("复制失败，请手动选择", "Copy failed, select manually");
    btn.classList.toggle("is-done", success);

  if (ok) return done(true);

    }).join("") + "</ul></div>";
}

/* ---------- app ---------- */
var TABS = ["overview", "positions", "csc", "supervisors", "channels", "comp"];
var VIEWS = { overview: viewOverview, positions: viewPositions, csc: viewCSC, supervisors: viewSupervisors, channels: viewChannels, comp: viewComp };
state.tab = TABS.indexOf((location.hash || "").slice(1)) >= 0 ? location.hash.slice(1) : "overview";
state.drawer = null;
function render() {
  var root = document.documentElement;
  root.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
  document.title = t("brand");
  document.querySelector(".x-seg").setAttribute("aria-label", L("语言", "Language"));
  document.getElementById("x-tabs").setAttribute("aria-label", L("标签页", "Tabs"));
  document.getElementById("x-drawer-panel").setAttribute("aria-label", L("导师详情", "Supervisor details"));
  document.getElementById("x-brand").textContent = t("brand");
  document.getElementById("x-updated").textContent = t("updated") + " " + (DATA.updated || "—");
  document.getElementById("x-foot").textContent = t("foot");
  [].forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
    var on = b.getAttribute("data-lang") === lang;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    if (b.getAttribute("data-lang") === "zh") { b.textContent = lang === "en" ? "ZH" : "中文"; b.setAttribute("aria-label", L("中文", "Chinese")); }
    else b.setAttribute("aria-label", L("英文", "English"));
  });
  document.getElementById("x-tabs").innerHTML = TABS.map(function (k) {
    return '<a href="#' + k + '" data-tab="' + k + '"' + (k === state.tab ? ' aria-current="page"' : "") + ">" + esc(T.tabs[k][lang]) + "</a>";
  }).join("");
  COPY = [];
  document.getElementById("app").innerHTML = VIEWS[state.tab]();
  if (state.drawer != null) openDrawer(state.drawer);
  setTopH();
  tocSpy();
}
function setLang(l) { lang = l; render(); }
[].forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
  b.onclick = function () { setLang(b.getAttribute("data-lang")); };
});
document.getElementById("x-tabs").addEventListener("click", function (e) {
  var a = e.target.closest("[data-tab]");
  if (!a) return;
  e.preventDefault();
  state.tab = a.getAttribute("data-tab");
  try { history.replaceState(null, "", "#" + state.tab); } catch (err) {}
  render();
  window.scrollTo(0, 0);
});
var app = document.getElementById("app");
app.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (act === "set") { state[el.getAttribute("data-k")] = el.getAttribute("data-v"); render(); }
  else if (act === "open") openDrawer(Number(el.getAttribute("data-i")));
  else if (act === "cardx") setCard(el.getAttribute("data-card"), !state.openCards[el.getAttribute("data-card")]);
  else if (act === "supx") {
    var ck = el.getAttribute("data-card"), si = Number(el.getAttribute("data-i"));
    setSup(ck, si, !state.openSups[ck + "-" + si]);
  }
  else if (act === "supchip") jumpSup(el.getAttribute("data-card"), Number(el.getAttribute("data-i")));
  else if (act === "copy") copyText(COPY[Number(el.getAttribute("data-c"))] || "", el);
  else if (act === "phdall") phdExpand(el);
  else if (act === "elang") setEmailLang(el.getAttribute("data-v"));
  else if (act === "toc") {
    e.preventDefault();
    var tg = document.getElementById(el.getAttribute("data-id"));
    if (tg) { tg.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); tg.setAttribute("tabindex", "-1"); tg.focus({ preventScroll: true }); }
  }
});
app.addEventListener("keydown", function (e) {
  var el = e.target.closest('[data-act="open"]');
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDrawer(Number(el.getAttribute("data-i"))); }
});
function onField(e) {
  var el = e.target, k = el.getAttribute && el.getAttribute("data-f");
  if (!k) return;
  if (el.type === "checkbox") state[k] = el.checked;
  else if (el.type === "range") state[k] = Number(el.value);
  else state[k] = el.value;
  if (k === "supQ" || k === "supMin") {
    if (k === "supMin") document.getElementById("x-supmin").textContent = state.supMin;
    document.getElementById("x-sup-list").innerHTML = supListHtml();
  } else if (e.type === "change") render();
}
app.addEventListener("input", onField);
app.addEventListener("change", function (e) { if (e.target.type !== "search" && e.target.type !== "range") onField(e); });
document.getElementById("x-drawer").addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (act === "close") closeDrawer();
  else if (act === "phdall") phdExpand(el);
  else if (act === "copy") copyText(COPY[Number(el.getAttribute("data-c"))] || "", el);
  else if (act === "elang") setEmailLang(el.getAttribute("data-v"));
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.drawer != null) closeDrawer(); });
render();

    </script>
  </body>
</html>
